services:
  # Backend Web Service
  - type: web
    name: smart-mess-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: RAZORPAY_KEY_ID
        value: rzp_test_SmartMess2026Key
      - key: RAZORPAY_KEY_SECRET
        value: smartMessSecretKey9928347
      - key: RAZORPAY_WEBHOOK_SECRET
        value: smartMessWebhookSecret2026

  # Frontend Static Site
  - type: web
    name: smart-mess-frontend
    env: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: smart-mess-backend
          property: host
